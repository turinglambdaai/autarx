name: ci

# Build + test on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Autarx.slnx -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: CLI smoke test
        run: |
          dotnet run --project src/Autarx.Cli -c Release --no-build -- info tests/Autarx.Tests/Fixtures/minimal.arxml
          dotnet run --project src/Autarx.Cli -c Release --no-build -- validate tests/Autarx.Tests/Fixtures/minimal.arxml --json
          dotnet run --project src/Autarx.Cli -c Release --no-build -- inspect tests/Autarx.Tests/Fixtures/OemDelivery --json
          dotnet run --project src/Autarx.Cli -c Release --no-build -- find VehicleSpeed tests/Autarx.Tests/Fixtures/OemDelivery --json
          dotnet run --project src/Autarx.Cli -c Release --no-build -- ecus tests/Autarx.Tests/Fixtures/OemDelivery
          dotnet run --project src/Autarx.Cli -c Release --no-build -- ecu tests/Autarx.Tests/Fixtures/OemDelivery RadarFL --json
          dotnet run --project src/Autarx.Cli -c Release --no-build -- refs VehicleSpeed tests/Autarx.Tests/Fixtures/OemDelivery --incoming
          dotnet run --project src/Autarx.Cli -c Release --no-build -- trace Pdu_VehicleSpeed tests/Autarx.Tests/Fixtures/OemDelivery --depth 2 --json
          # the fixture intentionally contains one unresolved reference —
          # the gate is the exit code, not just the output (bash -e would
          # abort on the expected failure, so disable it for the check)
          set +e
          dotnet run --project src/Autarx.Cli -c Release --no-build -- unresolved tests/Autarx.Tests/Fixtures/OemDelivery --json
          code=$?
          set -e
          test "$code" -eq 1
