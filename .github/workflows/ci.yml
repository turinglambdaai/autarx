name: ci

# Contract tests + CLI smoke on every push/PR to the migration line.
on:
  push:
    branches: [main, experiment/autarx-rivet]
  pull_request:
    branches: [main, experiment/autarx-rivet]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'

      - name: Link rivet
        run: |
          git clone https://github.com/turinglambdaai/rivet.git /tmp/rivet
          cd /tmp/rivet
          git checkout 2fcdd091ddd7fd157fa934ac6053cdf4f9ab6100  # release generator pin, matches release.yml
          raco pkg install --auto --no-docs --name rivet --link "file://$PWD"

      - name: Install autarx core
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$PWD/racket"

      - name: Contract tests (101 + RVT1 smoke)
        run: raco test racket/

      - name: CLI exit-code smoke
        run: |
          # expected non-zero exits below must not trip bash -e
          set +e
          racket racket/autarx/cli.rkt inspect shared/fixtures/OemDelivery --json > /dev/null
          inspect_rc=$?
          racket racket/autarx/cli.rkt unresolved shared/fixtures/OemDelivery --json > /dev/null
          unresolved_rc=$?
          racket racket/autarx/cli.rkt diff shared/fixtures/DiffBefore shared/fixtures/DiffAfter --json > /dev/null
          diff_rc=$?
          set -e
          test "$inspect_rc" -eq 0
          test "$unresolved_rc" -eq 1
          test "$diff_rc" -eq 1

  macos-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'

      - name: Link rivet + build staged app
        run: |
          git clone https://github.com/turinglambdaai/rivet.git /tmp/rivet
          cd /tmp/rivet
          git checkout 2fcdd091ddd7fd157fa934ac6053cdf4f9ab6100  # last generator without the RivetTypes namespace (breaks this host)
          raco pkg install --auto --no-docs --name rivet --link "file://$PWD"
          cd "$GITHUB_WORKSPACE"
          raco pkg install --auto --no-docs --name autarx-core --link "file://$PWD/racket"
          raco rivet doctor --json
          raco rivet build
