name: ci

# Contract tests + CLI smoke on every push/PR to the migration line.
on:
  push:
    branches: [main, experiment/autarx-rivet]
  pull_request:
    branches: [main, experiment/autarx-rivet]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Racket
        uses: Bogdanp/racket-setup@v1
        with:
          variant: CS
          version: stable

      - name: Link rivet
        run: |
          git clone --depth 1 https://github.com/turinglambdaai/rivet.git /tmp/rivet
          cd /tmp/rivet
          raco pkg install --auto --no-docs --name rivet --link "file://$PWD"

      - name: Install autarx core
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$PWD/racket"

      - name: Contract tests (101 + RVT1 smoke)
        run: raco test racket/

      - name: CLI exit-code smoke
        run: |
          racket racket/autarx/cli.rkt inspect shared/fixtures/OemDelivery --json > /dev/null
          test $? -eq 0
          racket racket/autarx/cli.rkt unresolved shared/fixtures/OemDelivery --json > /dev/null
          test $? -eq 1
          racket racket/autarx/cli.rkt diff shared/fixtures/DiffBefore shared/fixtures/DiffAfter --json > /dev/null
          test $? -eq 1

  macos-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Racket
        uses: Bogdanp/racket-setup@v1
        with:
          variant: CS
          version: stable

      - name: Link rivet + build staged app
        run: |
          git clone --depth 1 https://github.com/turinglambdaai/rivet.git /tmp/rivet
          cd /tmp/rivet
          raco pkg install --auto --no-docs --name rivet --link "file://$PWD"
          cd "$GITHUB_WORKSPACE"
          raco pkg install --auto --no-docs --name autarx-core --link "file://$PWD/racket"
          raco rivet doctor --json
          raco rivet build
