name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Check release tag against the version single source
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

  macos:
    name: macOS DMG
    needs: validate
    # macos-15: decoupled from the macos-latest pool (runner queue lesson).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          ref: 2fcdd091ddd7fd157fa934ac6053cdf4f9ab6100  # last generator without the RivetTypes namespace (breaks this host)
          path: rivet
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          # arm64-native packaging: without this the runner builds under
          # Rosetta and ships an x86_64 app (the PodLens release bug).
          architecture: arm64
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Link autarx core
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$GITHUB_WORKSPACE/racket"
      - name: Package
        run: raco rivet package
      - name: Human installer (DMG, drag to Applications)
        run: |
          volname=Autarx
          dmg="autarx-${{ github.ref_name }}-macos-arm64.dmg"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/autarx.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "$volname" -srcfolder "$staging" -ov -format UDZO "$dmg"
          hdiutil attach "$dmg" -mountpoint /tmp/autarx-dmg-verify -readonly
          test -d /tmp/autarx-dmg-verify/Autarx.app
          hdiutil detach /tmp/autarx-dmg-verify
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: autarx-*-macos-arm64.dmg
          if-no-files-found: error

  cli:
    name: CLI zip (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            racket-arch: arm64
          - platform: linux-x64
            os: ubuntu-latest
            racket-arch: x64
          - platform: windows-x64
            os: windows-latest
            racket-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          ref: 2fcdd091ddd7fd157fa934ac6053cdf4f9ab6100  # last generator without the RivetTypes namespace (breaks this host)
          path: rivet
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install crypto package (rivet dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
        shell: bash
      - name: Link autarx core
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$GITHUB_WORKSPACE/racket"
        shell: bash
      - name: Build CLI distribution
        run: bash scripts/build-cli.sh dist-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: dist-cli/autarx-*.zip
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, cli]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: arm64
          version: stable
          distribution: full
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Compose the update feed (latest.json)
        run: |
          racket scripts/make-update-feed.rkt \
            "${{ github.ref_name }}" dist \
            "https://github.com/turinglambdaai/autarx/releases/download/${{ github.ref_name }}"
      - name: Ensure SHA256SUMS
        run: |
          cd dist
          [ -f SHA256SUMS ] || {
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          }
          shasum -a 256 --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/autarx >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/autarx
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/autarx \
              --title "Autarx ${{ github.ref_name }}" \
              --notes "0.1.0 epoch reset of the Rivet rebuild. Assets follow the autarx-<version>-<os>-<arch> naming: the macOS workbench (Apple silicon, macOS 14+) ships as autarx-*-macos-arm64.dmg; the CLI ships as self-contained zips — autarx-*-macos-arm64.zip, autarx-*-linux-x64.zip, autarx-*-windows-x64.zip — and updates itself through a checksum-verified feed (\`autarx update\`). Windows and Linux GUI hosts are in development. Ad-hoc signed — on first launch, right-click the app and choose Open."
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
