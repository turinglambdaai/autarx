name: Release

on:
  push:
    tags: ["v*"]

env:
  # Single pin source, same value as ci.yml. Release used to reference
  # env.RIVET_PIN without defining it: the empty ref made `raco pkg
  # install 'URL#'` silently resolve to rivet main-HEAD, so release
  # artifacts were built from an untested commit while the contract tests
  # ran the pinned version (v0.4.1 / v0.4.2 shipped this way).
  RIVET_PIN: v0.12.0
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          version: stable
          distribution: full
      - name: Check release tag against the version single source
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

  macos:
    name: macOS DMG (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15: decoupled from the macos-latest pool (runner queue lesson).
          - arch: arm64
            os: macos-15
            racket-arch: arm64
          - arch: x64
            os: macos-15-intel
            racket-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          # arch-native packaging: without this the runner builds under
          # Rosetta and ships an x86_64 app (the PodLens release bug).
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Link autarx core
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$GITHUB_WORKSPACE/racket"
      - name: Package
        run: raco rivet package
      - name: Human installer (DMG, drag to Applications)
        run: |
          volname=Autarx
          # strip the tag's v prefix: the filename carries the bare version
          dmg="autarx-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}.dmg"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/autarx.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "$volname" -srcfolder "$staging" -ov -format UDZO "$dmg"
          hdiutil attach "$dmg" -mountpoint /tmp/autarx-dmg-verify -readonly
          test -d /tmp/autarx-dmg-verify/Autarx.app
          hdiutil detach /tmp/autarx-dmg-verify
      - name: Portable app zip (workbench update payload)
        run: |
          # Canonical bundle name inside the archive: the workbench updater
          # unpacks and swaps Autarx.app by exact path (UpdateService.swift).
          appstage="$(mktemp -d)/Autarx.app"
          cp -R dist/autarx.app "$appstage"
          ditto -c -k --sequesterRsrc --keepParent "$appstage" \
            "autarx-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}-app.zip"
          unzip -l "autarx-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}-app.zip" | head -4
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            autarx-*-macos-${{ matrix.arch }}.dmg
            autarx-*-macos-${{ matrix.arch }}-app.zip
          if-no-files-found: error

  cli:
    name: CLI zip (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            racket-arch: arm64
          - platform: macos-x64
            os: macos-15-intel
            racket-arch: x64
          - platform: linux-x64
            os: ubuntu-latest
            racket-arch: x64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            racket-arch: arm64
          - platform: windows-x64
            os: windows-latest
            racket-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Link autarx core
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$GITHUB_WORKSPACE/racket"
        shell: bash
      - name: Build CLI distribution
        run: bash scripts/build-cli.sh dist-cli
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: dist-cli/autarx-*.zip
          if-no-files-found: error

  windows:
    name: Windows workbench (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install WiX (v5; rivet's MSI toolchain)
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2
      - name: Install crypto (updater dependency)
        shell: pwsh
        run: raco pkg install --auto --no-docs crypto
      - name: Link autarx core
        shell: bash
        # cygpath -m: Racket needs a Windows-mixed path in the file:// URL —
        # git-bash's $PWD is a POSIX path Racket cannot resolve.
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$(cygpath -m "$PWD/racket")"
      - name: Release (MSI + portable zip)
        shell: pwsh
        run: raco rivet release --without-updates --development
      - name: Family naming
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # The portable zip is the workbench update payload and gets the
          # family -app suffix — the plain name belongs to the CLI zip (the
          # separate cli job ships it). The MSI keeps the plain family name:
          # the updater derives its release URL from the feed zip entry.
          mv "autarx-${VERSION}-windows-x64.zip" \
             "autarx-${VERSION}-windows-x64-app.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/autarx-*
          if-no-files-found: error

  linux:
    name: Linux workbench (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@v0.13.0
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own. crypto backs the updater.
      - name: Install Rivet (catalog) and backend packages
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Install GTK4, rpm and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev cmake ninja-build \
            pkg-config file rpm desktop-file-utils
      - name: Link autarx core
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$PWD/racket"
      # tar.gz (the workbench update payload) + deb + rpm + AppImage, launch
      # smoke included. The AppImage carries its own GTK4 dependency
      # closure; APPIMAGE_EXTRACT_AND_RUN lets appimagetool run on the
      # runner.
      - name: Release (tar.gz + deb + rpm + AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: raco rivet release --without-updates --development
      - name: Family naming
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          # The tar.gz is the workbench update payload and gets the family
          # -app suffix. The release's portable zip is dropped: its payload
          # duplicates the tar.gz and its plain name belongs to the CLI zip.
          mv "autarx-${VERSION}-linux-${ARCH}.tar.gz" \
             "autarx-${VERSION}-linux-${ARCH}-app.tar.gz"
          rm -f "autarx-${VERSION}-linux-${ARCH}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/autarx-*
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, cli, windows, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Per-asset .sha256 sidecars
        run: |
          cd dist
          for f in autarx-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || shasum -a 256 "$f" > "$f.sha256" ;;
            esac
          done
      - name: Sign the CLI update feed (update-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          # Fail-closed: no key, no release. Starting with 0.4.1 the CLI
          # feed is an Ed25519 signed wrapper — an unauthenticated feed is
          # the supply-chain gap this retires (shared/spec/UPDATE.md).
          racket scripts/make-update-feed.rkt \
            "${{ github.ref_name }}" dist \
            "https://github.com/turlamai/autarx/releases/download/${{ github.ref_name }}"
      - name: Sign the workbench update manifest (update-app-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          # Fail-closed, same contract as the CLI feed above: no key, no
          # release. All three hosts verify the wrapper signature before
          # parsing — the macOS host via RivetUpdate, the Windows and Linux
          # hosts through the backend updater — so shipping without the
          # feed would strand every installed copy on "release has no
          # update manifest".
          if [ -z "$UPDATE_ED25519_PRIVATE_KEY_B64" ]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY_B64 is not set — refusing to publish without the signed workbench feed (shared/spec/UPDATE.md)"
            exit 1
          fi
          keyder="$(mktemp /tmp/autarx-key-XXXXXX)"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$keyder"
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$keyder"
          rm -f "$keyder"
      - name: Ensure SHA256SUMS
        run: |
          cd dist
          [ -f SHA256SUMS ] || {
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          }
          shasum -a 256 --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          notes="Autarx ${ver}. The workbench ships on all three desktops: macOS (Apple silicon and Intel) as autarx-<version>-macos-<arch>.dmg, Windows as autarx-<version>-windows-x64.msi, Linux as .deb/.rpm/.AppImage for the common architectures. Every host updates in place through the Ed25519-signed feed (update-app-manifest.json); Linux tarball hand-offs stay manual — extract the -app.tar.gz over the install directory. The CLI ships as self-contained zips — autarx-<version>-{macos-arm64,macos-x64,linux-x64,linux-arm64,windows-x64}.zip — and updates itself through \`autarx update\`. Every asset carries a .sha256 sidecar. Ad-hoc signed — on first macOS launch, right-click the app and choose Open."
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/autarx >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/autarx
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/autarx \
              --title "Autarx ${{ github.ref_name }}" \
              --notes "$notes"
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Stable alias copies (versionless direct-download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Family rule: download buttons point at
          # releases/latest/download/<alias>, so every release also ships
          # versionless copies of the primary installers. Aliases are
          # overwritten on each release; the versioned assets stay
          # canonical. The *-app.zip / *-app.tar.gz payloads are
          # update-feed internals and get no alias. Deliberately after the
          # provenance attestation so dist/* there stays versioned-only.
          mkdir -p stable-alias
          cp "dist/autarx-${VERSION}-macos-arm64.dmg" stable-alias/autarx-macos-arm64.dmg
          cp "dist/autarx-${VERSION}-macos-x64.dmg" stable-alias/autarx-macos-x64.dmg
          cp "dist/autarx-${VERSION}-windows-x64.msi" stable-alias/autarx-windows-x64.msi
          cp "dist/autarx-${VERSION}-linux-amd64.deb" stable-alias/autarx-linux-x64.deb
          cp "dist/autarx-${VERSION}-linux-arm64.deb" stable-alias/autarx-linux-arm64.deb
          cp "dist/autarx-${VERSION}-linux-x86_64.AppImage" stable-alias/autarx-linux-x64.AppImage
          cp "dist/autarx-${VERSION}-linux-aarch64.AppImage" stable-alias/autarx-linux-arm64.AppImage
          cp "dist/autarx-${VERSION}-macos-arm64.zip" stable-alias/autarx-macos-arm64.zip
          cp "dist/autarx-${VERSION}-macos-x64.zip" stable-alias/autarx-macos-x64.zip
          cp "dist/autarx-${VERSION}-windows-x64.zip" stable-alias/autarx-windows-x64.zip
          cp "dist/autarx-${VERSION}-linux-x64.zip" stable-alias/autarx-linux-x64.zip
          cp "dist/autarx-${VERSION}-linux-arm64.zip" stable-alias/autarx-linux-arm64.zip
          gh release upload "${{ github.ref_name }}" stable-alias/* --clobber -R turinglambdaai/autarx
