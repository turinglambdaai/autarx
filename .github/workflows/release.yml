name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Check release tag against the version single source
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

  macos:
    name: macOS DMG (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15: decoupled from the macos-latest pool (runner queue lesson).
          - arch: arm64
            os: macos-15
            racket-arch: arm64
          - arch: x64
            os: macos-15-intel
            racket-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          # arch-native packaging: without this the runner builds under
          # Rosetta and ships an x86_64 app (the PodLens release bug).
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs rivet
      - name: Link autarx core
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$GITHUB_WORKSPACE/racket"
      - name: Package
        run: raco rivet package
      - name: Human installer (DMG, drag to Applications)
        run: |
          volname=Autarx
          # strip the tag's v prefix: the filename carries the bare version
          dmg="autarx-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}.dmg"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/autarx.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "$volname" -srcfolder "$staging" -ov -format UDZO "$dmg"
          hdiutil attach "$dmg" -mountpoint /tmp/autarx-dmg-verify -readonly
          test -d /tmp/autarx-dmg-verify/Autarx.app
          hdiutil detach /tmp/autarx-dmg-verify
      - name: Portable app zip (workbench update payload)
        run: |
          # Canonical bundle name inside the archive: the workbench updater
          # unpacks and swaps Autarx.app by exact path (UpdateService.swift).
          appstage="$(mktemp -d)/Autarx.app"
          cp -R dist/autarx.app "$appstage"
          ditto -c -k --sequesterRsrc --keepParent "$appstage" \
            "autarx-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}-app.zip"
          unzip -l "autarx-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}-app.zip" | head -4
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            autarx-*-macos-${{ matrix.arch }}.dmg
            autarx-*-macos-${{ matrix.arch }}-app.zip
          if-no-files-found: error

  cli:
    name: CLI zip (${{ matrix.platform }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            racket-arch: arm64
          - platform: macos-x64
            os: macos-15-intel
            racket-arch: x64
          - platform: linux-x64
            os: ubuntu-latest
            racket-arch: x64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            racket-arch: arm64
          - platform: windows-x64
            os: windows-latest
            racket-arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs rivet
        shell: bash
      - name: Link autarx core
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$GITHUB_WORKSPACE/racket"
        shell: bash
      - name: Build CLI distribution
        run: bash scripts/build-cli.sh dist-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: dist-cli/autarx-*.zip
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, cli]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs rivet
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Per-asset .sha256 sidecars
        run: |
          cd dist
          for f in autarx-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || shasum -a 256 "$f" > "$f.sha256" ;;
            esac
          done
      - name: Sign the CLI update feed (update-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          # Fail-closed: no key, no release. The CLI feed is an Ed25519
          # signed wrapper since 0.4.0 — an unauthenticated feed is the
          # supply-chain gap this retires (shared/spec/UPDATE.md). Builds
          # up to 0.2.0 read the old checksum shape and report a failed
          # check against the signed feed until manually updated once.
          racket scripts/make-update-feed.rkt \
            "${{ github.ref_name }}" dist \
            "https://github.com/turinglambdaai/autarx/releases/download/${{ github.ref_name }}"
      - name: Sign the workbench update manifest (update-app-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          if [ -n "$UPDATE_ED25519_PRIVATE_KEY_B64" ]; then
            keyder="$(mktemp /tmp/autarx-key-XXXXXX)"
            printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$keyder"
            bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$keyder"
            rm -f "$keyder"
          else
            echo "::warning::UPDATE_ED25519_PRIVATE_KEY_B64 is not set — publishing without the workbench update manifest; in-app updates will report 'release has no update manifest'"
          fi
      - name: Ensure SHA256SUMS
        run: |
          cd dist
          [ -f SHA256SUMS ] || {
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          }
          shasum -a 256 --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          notes="Autarx ${ver}. The macOS workbench (macOS 14+, Apple silicon and Intel) ships as autarx-<version>-macos-<arch>.dmg for human install and as autarx-<version>-macos-<arch>-app.zip — the payload the workbench's built-in updater consumes (Ed25519-signed feed, in-app update with relaunch). The CLI ships as self-contained zips — autarx-<version>-macos-arm64.zip, -macos-x64.zip, -linux-x64.zip, -linux-arm64.zip, -windows-x64.zip — and updates itself through an Ed25519-signed feed (\`autarx update\`). Every asset carries a .sha256 sidecar. Windows and Linux GUI hosts are in development. Ad-hoc signed — on first launch, right-click the app and choose Open."
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/autarx >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/autarx
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/autarx \
              --title "Autarx ${{ github.ref_name }}" \
              --notes "$notes"
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
