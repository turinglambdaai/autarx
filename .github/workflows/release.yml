name: release

# Builds self-contained single-file binaries on GitHub's runners and ships
# them via GitHub Releases — end users just download their platform's zip
# and run, no .NET install needed.
#   - workflow_dispatch : manual run — preflight, tests and build artifacts only.
#   - push tag v*        : after preflight + tests pass, creates a GitHub Release
#                          with the zips, a verified SHA256SUMS manifest and
#                          Sigstore build-provenance attestations.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Directory.Build.props version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n1 | tr -d '[:space:]')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match Directory.Build.props version '$VERSION'" >&2
            exit 1
          fi
          echo "release preflight: version $VERSION verified"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Autarx.slnx -c Release
      - name: Test
        run: dotnet test Autarx.slnx -c Release --no-build

  build:
    needs: [preflight, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   platform: windows-x64 }
          - { rid: osx-arm64, platform: macos-arm64 }
          - { rid: linux-x64, platform: linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish GUI (${{ matrix.rid }})
        run: >-
          dotnet publish src/Autarx.Gui/Autarx.Gui.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish/gui

      - name: Publish CLI (${{ matrix.rid }})
        run: >-
          dotnet publish src/Autarx.Cli/Autarx.Cli.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish/cli

      - name: Package
        working-directory: publish
        run: |
          zip -r "Autarx-gui-${{ matrix.platform }}.zip" gui -x '*.pdb'
          zip -r "Autarx-cli-${{ matrix.platform }}.zip" cli -x '*.pdb'

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            publish/Autarx-gui-${{ matrix.platform }}.zip
            publish/Autarx-cli-${{ matrix.platform }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autarx-${{ matrix.platform }}
          path: |
            publish/Autarx-gui-${{ matrix.platform }}.zip
            publish/Autarx-cli-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\] " {flag=1; next}
            /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for details." > notes.md
          fi
          cat notes.md

      - name: Generate checksum manifest
        working-directory: dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
